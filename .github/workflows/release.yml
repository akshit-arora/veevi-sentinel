name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl for full static portability without glibc dependency)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            target_os: linux
            target_arch: x86_64
            use_cross: true

          # Linux ARM64 (musl static)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            target_os: linux
            target_arch: aarch64
            use_cross: true

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            target_os: darwin
            target_arch: x86_64
            use_cross: false

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            target_os: darwin
            target_arch: aarch64
            use_cross: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Tooling
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross.git --rev 0c32de782f9c4240428f52281a8ab274358a9893 || cargo install cross --locked

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Archive
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "release.yml" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          fi

          ARCHIVE_NAME="veevi-sentinel-${VERSION}-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz"
          STAGE_DIR="stage-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"

          cp "target/${{ matrix.target }}/release/veevi-sentinel" "$STAGE_DIR/"
          chmod +x "$STAGE_DIR/veevi-sentinel"
          cp LICENSE "$STAGE_DIR/" 2>/dev/null || true
          cp README.md "$STAGE_DIR/" 2>/dev/null || true

          tar -czf "$ARCHIVE_NAME" -C "$STAGE_DIR" veevi-sentinel

          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS Manifest
        run: |
          cd release-artifacts
          sha256sum *.tar.gz > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Veevi Sentinel ${{ github.ref_name || inputs.tag }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
